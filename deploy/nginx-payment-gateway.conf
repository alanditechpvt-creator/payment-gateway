# Frontend - Customer Portal (Next.js on 5000)
# Copy to VPS: sudo cp deploy/nginx-payment-gateway.conf /etc/nginx/sites-available/payment-gateway
# Then: sudo nginx -t && sudo systemctl reload nginx

# Frontend - Customer Portal
server {
    server_name pay.alandi.in;

    # Backend API - Must come before location /
    location /api {
        proxy_pass http://localhost:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }

    # Frontend (Next.js - port 5000)
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pay.alandi.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pay.alandi.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Admin Panel (port 5002 - keep as is)
server {
    server_name admin.pay.alandi.in;

    location / {
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pay.alandi.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pay.alandi.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pay.alandi.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pay.alandi.in;
    return 404; # managed by Certbot
}
server {
    if ($host = admin.pay.alandi.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admin.pay.alandi.in;
    return 404; # managed by Certbot
}
